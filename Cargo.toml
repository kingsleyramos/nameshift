[workspace]
resolver = "2"
members = ["src-tauri", "crates/engine", "crates/store", "crates/watcher", "crates/metadata"]

[workspace.package]
version = "2.0.0"
edition = "2021"
license = "MIT"
authors = ["Kingsley Ramos"]
repository = "https://github.com/kingsleyramos/nameshift"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
tracing = "0.1"

[profile.release]
codegen-units = 1
lto = true
strip = true
