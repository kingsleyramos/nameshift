# cargo-deny configuration — advisories and license policy (§2 supply chain).

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Only fail on unmaintained crates we depend on directly. The transitive ones
# are unavoidable: gtk-rs GTK3 bindings (Tauri/webkit2gtk on Linux), the unic-*
# Unicode crates, and proc-macro-error all come in through upstream deps we
# don't control. Security vulnerabilities still fail regardless of this setting.
unmaintained = "workspace"

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "MPL-2.0",
  "Unicode-3.0",
  "CDLA-Permissive-2.0",
  "Zlib",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
