[package]
name = "nameshift"
description = "Name Shift — bulk-rename files and folders with live preview and full undo history"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "nameshift_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
nameshift-engine = { path = "../crates/engine", version = "2.0.0" }
nameshift-store = { path = "../crates/store", version = "2.0.0" }
nameshift-watcher = { path = "../crates/watcher", version = "2.0.0" }
nameshift-metadata = { path = "../crates/metadata", version = "2.0.0" }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
tracing.workspace = true
tauri-plugin-dialog = "2.7.2"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-opener = "2.5.4"
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-window-state = "2.4.1"
ts-rs = { version = "12.0.1", features = ["uuid-impl", "chrono-impl"] }
chrono = "0.4.45"

[features]
# Distribution channels (§20). Exactly one is active per build; `channel-direct`
# is the default and the only one that compiles the updater.
default = ["channel-direct"]
channel-direct = []
channel-mas = []
channel-msstore = []
channel-flathub = []
