name: Build all platforms

# On-demand: builds unsigned macOS/Windows/Linux bundles in parallel and
# uploads them as workflow artifacts (7-day retention). No tag or release
# needed — for shippable, updater-signed builds use release.yml (tag v*).
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            args: --target universal-apple-darwin
            path: |
              target/universal-apple-darwin/release/bundle/dmg/*.dmg
              target/universal-apple-darwin/release/bundle/macos/*.app
          - name: Windows
            os: windows-latest
            args: ''
            path: |
              target/release/bundle/nsis/*.exe
              target/release/bundle/msi/*.msi
          - name: Linux
            os: ubuntu-latest
            args: ''
            path: |
              target/release/bundle/appimage/*.AppImage
              target/release/bundle/deb/*.deb
              target/release/bundle/rpm/*.rpm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Build bundles
        run: pnpm tauri build ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: nameshift-${{ matrix.name }}
          path: ${{ matrix.path }}
          retention-days: 7
