name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Rust format
        run: cargo fmt --all --check

      - name: Rust lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --workspace

      - name: Frontend lint
        run: pnpm lint

      - name: Frontend typecheck
        run: pnpm typecheck

      - name: Version sync (package.json is the source)
        run: pnpm check:versions

      - name: Frontend production build
        # Release-mode `vite build` runs the real minifier; the debug bundle
        # below sets minify:false and never would. Fast, always-run guard.
        run: pnpm build

      - name: Frontend tests
        run: pnpm test -- --coverage

      - name: Bundle smoke (debug build)
        run: pnpm tauri build --debug

  coverage:
    name: Engine coverage gate (≥ 85%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Coverage (§18.6 gate)
        run: cargo llvm-cov -p nameshift-engine --fail-under-lines 85

  ui:
    name: Interface (${{ matrix.os }})
    # Playwright ships its own Chromium and WebKit for all three platforms, so
    # this suite runs and passes identically everywhere — no desktop driver.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Install browsers
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: Build frontend
        run: pnpm build
      - name: Interface tests
        run: pnpm test:ui
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.os }}
          path: playwright-report/
          retention-days: 7

  channels:
    name: Channel compile (${{ matrix.channel }})
    # Each non-default channel gates OS-specific code behind cfg(feature),
    # which nothing else compiles. Compile-check each on its target OS so a
    # break in MAS/MSStore/Flathub surfaces on PR, not at release.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            channel: channel-mas
          - os: windows-latest
            channel: channel-msstore
          - os: ubuntu-latest
            channel: channel-flathub
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Build frontend (tauri-build reads the dist dir)
        run: pnpm build
      - name: Compile-check channel
        run: cargo check -p nameshift --no-default-features --features ${{ matrix.channel }}

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources
